admin_password = "replace-with-your-private-dashboard-password"

[connections.postgresql]
dialect = "postgresql"
driver = "psycopg2"
host = "your-postgres-host"
port = 5432
database = "your-database-name"
username = "dashboard_reader"
password = "replace-with-the-database-password"
query = { sslmode = "require" }

[road_closures_database]
enabled = true
schema = "public"
table = "road_closures"
geometry_column = "geom"
